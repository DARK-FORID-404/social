<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader - SaveGrab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="youtube-page">
    <div class="bg-animation">
        <div class="orb" style="background: var(--youtube-primary)"></div>
        <div class="orb" style="background: #ff4444"></div>
        <div class="orb" style="background: #ff6666"></div>
    </div>

    <nav class="navbar">
        <a href="/" class="nav-brand">
            <div class="logo-icon"><i class="fas fa-download"></i></div>
            SaveGrab
        </a>
        <button class="nav-toggle" onclick="toggleNav()">
            <span></span><span></span><span></span>
        </button>
        <ul class="nav-links" id="navLinks">
            <li><a href="/"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="/youtube" class="yt-active"><i class="fab fa-youtube"></i> YouTube</a></li>
            <li><a href="/facebook"><i class="fab fa-facebook"></i> Facebook</a></li>
            <li><a href="/instagram"><i class="fab fa-instagram"></i> Instagram</a></li>
            <li><a href="/tiktok"><i class="fab fa-tiktok"></i> TikTok</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="downloader-page">
            <!-- Header -->
            <div class="page-header youtube">
                <div class="page-icon"><i class="fab fa-youtube"></i></div>
                <h1>YouTube Downloader</h1>
                <p>Download YouTube videos in 360p, 480p, 720p, 1080p, 2K & MP3 audio</p>
            </div>

            <!-- Input -->
            <div class="input-section">
                <div class="input-wrapper">
                    <input type="text" class="url-input" id="urlInput" 
                           placeholder="Paste YouTube URL here... (e.g., https://youtube.com/watch?v=...)" 
                           autocomplete="off">
                    <button class="fetch-btn youtube-btn" id="fetchBtn" onclick="fetchVideo()">
                        <i class="fas fa-search"></i> Fetch
                    </button>
                </div>
            </div>

            <!-- Error -->
            <div class="error-message hidden" id="errorMsg">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>

            <!-- Loader -->
            <div class="loader-section" id="loader">
                <div class="spinner"></div>
                <p class="loader-text">Fetching video details...</p>
            </div>

            <!-- Results -->
            <div class="results-section" id="results">
                <!-- Video Preview -->
                <div class="video-preview" id="videoPreview">
                    <div class="preview-thumbnail">
                        <img id="thumbnail" src="" alt="Video Thumbnail">
                        <span class="preview-duration" id="duration"></span>
                    </div>
                    <div class="preview-info">
                        <h3 class="preview-title" id="videoTitle"></h3>
                        <div class="preview-meta">
                            <span id="videoAuthor"><i class="fas fa-user"></i> </span>
                            <span id="videoViews"><i class="fas fa-eye"></i> </span>
                        </div>
                    </div>
                </div>

                <!-- Download Options -->
                <div class="download-section">
                    <div class="download-tabs">
                        <button class="download-tab active" onclick="switchTab('video', this)">
                            <i class="fas fa-video"></i> Video
                        </button>
                        <button class="download-tab" onclick="switchTab('audio', this)">
                            <i class="fas fa-music"></i> Audio
                        </button>
                    </div>
                    <div class="download-content">
                        <!-- Video Tab -->
                        <div class="tab-panel active" id="videoTab">
                            <div class="quality-list" id="videoQualities">
                                <!-- Populated by JS -->
                            </div>
                        </div>
                        <!-- Audio Tab -->
                        <div class="tab-panel" id="audioTab">
                            <div class="quality-list" id="audioQualities">
                                <!-- Populated by JS -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2024 SaveGrab. All rights reserved.</p>
    </footer>

<!-- Remove all inline JS and just add this -->
<script src="/js/app.js"></script>
</body>
</html>
